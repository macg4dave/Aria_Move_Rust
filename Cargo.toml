[package]
name = "aria_move"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Dave"]
description = "A robust tool to move completed downloads for aria2c."

[dependencies]
anyhow = "1"
filetime = "0.2"
dunce = "1.0"
clap = { version = "4.2", features = ["derive"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "json",
] }
tracing-appender = "0.2"
walkdir = "2.3"
rayon = "1.7"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.41", features = ["serialize"] }
dirs = "6.0.0"
chrono = "0.4"
ctrlc = { version = "3.4", features = ["termination"] }
thiserror = "2.0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1.0"

[features]
# Preserve extended attributes on Unix copies (with --preserve-metadata).
xattrs = ["dep:xattr"]

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = []
installers = []
# Configure cargo-dist release targets for common platforms
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Enable checksums and a single tar/zip per target (defaults are fine)
checksum = "sha256"

[profile.dist]
inherits = "release"
