[graph]
# Check every supported release target, including both macOS universal components.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true
no-default-features = false

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = []  # add specific RUSTSEC-* IDs here if you must

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Deny if a crate is missing license info
# Common permissive licenses that are fine
allow = [
  "Apache-2.0",
  "MIT",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception",
]
# All licenses not explicitly allowed are rejected, including strong copyleft.
confidence-threshold = 0.8
exceptions = []