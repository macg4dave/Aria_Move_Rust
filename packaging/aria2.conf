# aria2 configuration

# Files and session persistence
dir=/var/lib/aria-move/incoming
input-file=/var/lib/aria-move/aria2.session
save-session=/var/lib/aria-move/aria2.session
save-session-interval=60
continue=true
always-resume=true
allow-overwrite=false
auto-file-renaming=true
content-disposition-default-utf8=true

# Download tuning: moderate concurrency for a small server
max-concurrent-downloads=5
max-connection-per-server=16
split=16
min-split-size=4M
disk-cache=32M
file-allocation=none
max-tries=10
retry-wait=10
connect-timeout=30
timeout=60

# RPC: exposed only via local nginx reverse proxy
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-allow-origin-all=false
# rpc-secret is not set here: the service inserts it at startup from
# /var/lib/aria-move/rpc-secret. Any rpc-secret line in this file is ignored.

# BitTorrent
listen-port=50101-50109
dht-listen-port=50101-50109
enable-dht=true
enable-dht6=true
enable-peer-exchange=true
max-upload-limit=50K
seed-time=0
# Best public trackers, checked by ngosang/trackerslist (2026-10-31)
bt-tracker=udp://tracker.opentrackr.org:1337/announce,udp://open.stealth.si:80/announce,udp://open.demonii.com:1337/announce,udp://open.tracker.cl:1337/announce,udp://tracker.skynetcloud.site:6969/announce,udp://tracker.qu.ax:6969/announce,udp://tracker.theoks.net:6969/announce,udp://tracker-udp.gbitt.info:80/announce,udp://explodie.org:6969/announce,udp://tracker.ducks.party:1984/announce,udp://tracker.tryhackx.org:6969/announce,udp://tracker.nyaa.vc:6969/announce,udp://tracker.dler.org:6969/announce,udp://tracker2.dler.org:80/announce,http://tracker.dler.com:6969/announce,udp://tracker.gmi.gd:6969/announce,http://tracker.renfei.net:8080/announce,udp://tracker.peerfect.org:6969/announce,udp://tracker.opentrackr.com:6969/announce,udp://tracker.ilibr.org:6969/announce

# Aria Move post-download processing
on-download-complete=/usr/bin/aria_move

# Logging level: only warnings and errors to console, everything to log file
console-log-level=warn